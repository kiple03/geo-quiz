name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR, but let every main run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    # This name is the status check to require in the branch ruleset.
    name: frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  backend:
    # Status check name; add it to the branch ruleset once it has run.
    name: backend (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25' # keep in step with <java.version> in backend/pom.xml
          cache: maven
          cache-dependency-path: backend/pom.xml

      # setup-java caches ~/.m2/repository only; the wrapper's Maven lives here.
      - uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      # Compile, test, package, and check formatting (Spotless runs in verify).
      - name: Verify
        run: ./mvnw -B verify
