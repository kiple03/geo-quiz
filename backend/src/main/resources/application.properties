spring.application.name=geo-quiz-backend

# Every endpoint lives under /api, the one prefix the Vite dev proxy forwards (ADR 0010).
# Controllers get it from ApiPathConfig. Actuator moves there too, with only its health
# endpoint exposed (GET /api/health) and no discovery page at GET /api.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
